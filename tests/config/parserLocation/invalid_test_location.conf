server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 2m;
    connections_max_number 10;
    client_max_header_size 20m;

    location / {
        root www;
        index index.html;
        autoindex off;
        methods GET;
        client_max_header_size 1m;
    }

    location /uploads {
        root www/uploads;
        methods GET POST DELETE;
        upload_store www/uploads;
        client_max_body_size 10m;
        connections_max_number 10;
    }

    location /cgi-bin {
        root www/cgi-bin;
        methods GET POST;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .sh /bin/bash;
        cgi_extension .cgi;
        client_max_body_size 10m;
        client_max_header_size 1m;
    }

    location /old {
        return 301 /new;
    }
}
