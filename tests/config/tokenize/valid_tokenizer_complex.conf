# ===== SERVER 1 =====

server{
    listen 127.0.0.1:8080;
    server_name "hello world" 'test server';

    location / {
        root "/var/www/{website}";
        index "index;test.html";
        autoindex off;
    }

    location /images{
        root '/var/www/images';
        autoindex on;
    }

    location /quotes {
        root "/var/www/#folder";
        index 'hello # world.html';
    }
}

# ===== SERVER 2 =====

server {
    listen 9090; # another port
    server_name localhost;

    location / {
        root /var/www/html;
        index index.html;
    }

    location /test{root "/var/www/test;folder";index 'hello {world}.html';}

    location /special {
        root "/var/www/escaped\"quote";
        index 'it\'s-working.html';
    }
}

# ===== SERVER 3 =====

server{listen 8081;server_name example.com;

location / {
    root /var/www/example;
    index index.html;
}

location /api{
    return 301 "https://example.com/path?x=1;y=2#section";
}

}