# ==========================================
# WEBSERV - SERVER DIRECTIVES TEST
# ==========================================

server {

    # Multiple listen directives
    # Default host: 0.0.0.0
    listen 8080;

    # Explicit IP address
    listen 127.0.0.1:8081;
    listen 192.168.1.10:9090;

    # Multiple server names on the same line
    server_name localhost example.com www.example.com;

    # Additional server names on another line
    server_name api.example.com admin.example.com;

    # Maximum request body size: 2 MB
    client_max_body_size 2m;

    # One error code mapped to one page
    error_page 404 /errors/404.html;

    # Multiple error codes sharing the same page
    error_page 500 502 503 504 /errors/50x.html;

    # Different error codes with different pages
    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 429 /errors/429.html;

    # Multiple codes sharing another page
    error_page 401 407 /errors/auth.html;
}