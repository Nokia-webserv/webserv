server {
    listen 127.0.0.1:8080;
    server_name localhost test.local;

    client_max_body_size 2m;

    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 502 504 /errors/5xx.html;

    location / {
        root www;
        index index.html;
        methods GET;
        autoindex off;
    }

    location /static {
        root www/static;
        methods GET;
        autoindex off;
    }

    location /files {
        root www/files;
        methods GET;
        autoindex on;
    }

    location /forbidden {
        root www/forbidden;
        methods GET;
        autoindex off;
    }

    location /upload {
        root www/uploads;
        methods GET POST DELETE;
        upload_store www/uploads;
        client_max_body_size 10m;
    }

    location /small-upload {
        root www/uploads;
        methods POST;
        upload_store www/uploads;
        client_max_body_size 100;
    }

    location /default-limit {
        root www;
        methods POST;
    }

    location /deletable {
        root www/deletable;
        methods DELETE;
    }

    location /submit {
        root www;
        methods POST;
    }

    location /all {
        root www;
        methods GET POST DELETE;
    }

    location /cgi-bin {
        root www/cgi-bin;
        methods GET POST;

        cgi_extension .py /usr/bin/python3;
        cgi_extension .sh /bin/bash;
        cgi_extension .pl /usr/bin/perl;
        cgi_extension .cgi;
    }

    location /old {
        return 301 /new;
    }

    location /external {
        return 302 https://example.com;
    }

    location /api {
        root www/api;
        methods GET POST;
    }

    location /foo {
        root www/foo;
        methods GET;
    }

    location /foobar {
        root www/foobar;
        methods GET;
    }

    location /kapouet {
        root www/kapouet;
        methods GET;
    }

    location /errors {
        root www/errors;
        methods GET;
    }
}


server {
    listen 127.0.0.1:9090;
    server_name second.local;

    client_max_body_size 1m;

    error_page 404 /errors/404.html;
    error_page 500 502 504 /errors/5xx.html;

    location / {
        root www2;
        index index.html;
        methods GET;
        autoindex off;
    }

    location /api {
        root www2/api;
        methods GET POST;
    }

    location /small {
        root www2;
        methods POST;
        client_max_body_size 200;
    }

    location /errors {
        root www2/errors;
        methods GET;
    }
}


server {
    listen 0.0.0.0:8081;
    server_name third.local;

    client_max_body_size 512k;

    location / {
        root www3;
        index index.html;
        methods GET;
        autoindex off;
    }
}
