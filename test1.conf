server {
    listen 127.0.0.1:8080;
    server_name body-test;
    client_max_body_size 10;

    location / {
        root www;
        methods GET;
    }

    location /small {
        root www;
        methods GET;
        client_max_body_size 5;
    }

    location /large {
        root www;
        methods GET;
        client_max_body_size 20;
    }
}