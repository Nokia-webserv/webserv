server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location /ambrman {
        cgi_extension .py /usr/bin/python3;
        cgi_extension .php /usr/bin/php;
        cgi_extension .bla /home/vbox/___Git_repos___/42/webserv/www/cgi_bin/cgi_tester.bla;
        methods POST DELETE;
        root ./www/cgi_bin;
    }

    location / {
        cgi_extension .py /usr/bin/python3;
        root ./www;
        methods GET;
        index index.html;
    }

    location /delete {
        root ./www/delete;
        methods GET;
    }

    location /delete/files {
        root ./www/delete/files;
        methods GET DELETE;
        autoindex on;
    }
}
