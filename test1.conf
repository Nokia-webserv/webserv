server {
    listen 127.0.0.1:8080;
    server_name localhost;

    client_max_header_size 100;

    location / {
        cgi_extension .py /usr/bin/python3;
        root ./www;
        methods GET;
    }

    location /old {
        return 301 /new;
    }

    location /new {
        root ./www;
        methods GET;
    }

    location /temporary {
        return 302 /new;
    }
}