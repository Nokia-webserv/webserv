server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location /ambrman {
        cgi_extension .py /usr/bin/python3;
        cgi_extension .php /usr/bin/php;
        methods POST DELETE;
        root ./www/cgi_bin;
    }

    location / {
        cgi_extension .py /usr/bin/python3;
        root ./www;
        methods GET;
    }

    location /old {
        return 301 /new;
    }

    location /new {
        root ./www;
        methods GET;
    }

    location /temporary {
        return 302 /new;
    }
}