server {
    listen 127.0.0.1:8080;
    server_name localhost;

    client_max_header_size 100;

    location / {
        root www;
        methods GET;
    }

    location /small {
        root www;
        methods GET;
        client_max_header_size 60;
    }

    location /large {
        root www;
        methods GET;
        client_max_header_size 200;
    }
}