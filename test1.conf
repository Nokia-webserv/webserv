server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location / {
        root ./www;
        methods GET;
        index index.html;
    }

    location /delete {
        root ./www/delete;
        methods GET;
    }

    location /delete/files {
        root ./www/delete/files;
        methods GET DELETE;
        autoindex on;
    }
}