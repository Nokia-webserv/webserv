name: Webserv Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Build test
        run: make build

      - name: Startup tests
        run: make startup

      - name: Config parser tests
        run: config

      - name: TCP accept tests
        run: accept

      - name: HTTP parser tests
        run: make parser
      
      - name: Integration tests
        run: integration
